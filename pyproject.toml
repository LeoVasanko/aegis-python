[build-system]
requires = ["setuptools>=84.0.0", "cffi>=2.1.1", "setuptools-scm>=10.3.4"]
build-backend = "build_backend"
backend-path = ["tools"]

[project]
name = "aeg"
dynamic = ["version"]
description = "AEGIS encryption easy to use Python binding. Wheels for major platforms."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
]
dependencies = [
    "cffi>=2.1.1",
]

[project.urls]
Homepage = "https://git.zi.fi/LeoVasanko/aegis-python"
Repository = "https://github.com/LeoVasanko/aegis-python"

[dependency-groups]
dev = [
    "auditwheel>=6.8.2",
    "patchelf>=0.17; sys_platform == 'linux'",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "setuptools>=84.0.0",
    "setuptools-scm>=10.3.4",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["aeg"]

[tool.setuptools.package-data]
aeg = ["*.h"]

[tool.ruff]
# Disable formatting in Markdown files
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = [
    "RUF022",  # __all__ is deliberately grouped with comments
    "RUF023",  # __slots__ is deliberately grouped
    "SIM117",  # nested with-statements are sometimes clearer
    "BLE001",  # blind except is intentional at CFFI callback boundaries
]

[tool.setuptools_scm]
